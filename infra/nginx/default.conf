# EDGE (Strangler Fig ka pehla step): saari requests pehle yahan aati hain.
# Abhi sab kuch legacy monolith ko jata hai. Jaise jaise service nikalenge,
# sirf ek ek location block add hoga. Frontend ko kuch nahi badalna padega.

upstream legacy {
    server legacy:8080;
    keepalive 32;
}

# --- Future upstreams (service extract hone par uncomment) ---
# upstream notification_service { server notification-service:8085; }
# upstream member_service       { server member-service:8081; }

server {
    listen 80;
    client_max_body_size 5m;

    location = /edge/health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Strangler routes: specific path pehle, catch-all baad mein ---
    # location /api/notifications { proxy_pass http://notification_service; include /etc/nginx/snippets/proxy.conf; }

    location /api/ {
        proxy_pass http://legacy;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        default_type text/plain;
        return 404 "Not found. Frontend Vite dev server (5173) se chalta hai.\n";
    }
}
