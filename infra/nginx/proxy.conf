proxy_http_version 1.1;
proxy_set_header Connection "";

# Monolith tenant (gym) ko Host header ke subdomain se bhi resolve karta hai,
# isliye original Host forward karna zaroori hai.
proxy_set_header Host              $http_host;

# Client ka bheja hua X-Forwarded-For OVERWRITE hota hai (append nahi).
# Monolith ka RateLimitingFilter isi header se IP leta hai; bina iske
# attacker fake header bhejke rate limit bypass kar sakta hai.
# (Jab is nginx ke aage koi aur load balancer aayega, tab ise revisit karna.)
proxy_set_header X-Real-IP        $remote_addr;
proxy_set_header X-Forwarded-For  $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_send_timeout    30s;
